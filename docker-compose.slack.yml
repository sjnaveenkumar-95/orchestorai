services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orchestorai
      POSTGRES_PASSWORD: orchestorai
      POSTGRES_DB: orchestorai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestorai -d orchestorai"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  orchestorai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ORCHESTORAI_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://orchestorai:orchestorai@db:5432/orchestorai"
      ORCHESTORAI_HOME: "${ORCHESTORAI_RUNTIME_HOME:-/orchestorai}"
      ORCHESTORAI_SLACK_ENABLED: "${ORCHESTORAI_SLACK_ENABLED:-false}"
      ORCHESTORAI_DEPLOYMENT_MODE: "${ORCHESTORAI_DEPLOYMENT_MODE:-authenticated}"
      ORCHESTORAI_DEPLOYMENT_EXPOSURE: "${ORCHESTORAI_DEPLOYMENT_EXPOSURE:-private}"
      ORCHESTORAI_PUBLIC_URL: "${ORCHESTORAI_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SLACK_MODE: "${SLACK_MODE:-socket}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:-}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_APP_ID: "${SLACK_APP_ID:-}"
      ORCHESTORAI_COMPANY_ID: "${ORCHESTORAI_COMPANY_ID:-}"
      ORCHESTORAI_TRIGGER_MENTIONS: "${ORCHESTORAI_TRIGGER_MENTIONS:-@orchestorai}"
      ORCHESTORAI_AGENT_MAPPINGS_JSON: "${ORCHESTORAI_AGENT_MAPPINGS_JSON:-{}}"
      ORCHESTORAI_PROJECT_MAPPINGS_JSON: "${ORCHESTORAI_PROJECT_MAPPINGS_JSON:-{}}"
      CODEX_MODEL: "${CODEX_MODEL:-gpt-5.3-codex}"
      CODEX_PROFILE: "${CODEX_PROFILE:-}"
      CODEX_SANDBOX: "${CODEX_SANDBOX:-workspace-write}"
      CODEX_ADDITIONAL_WRITABLE_DIRS: "${CODEX_ADDITIONAL_WRITABLE_DIRS:-}"
      CODEX_TIMEOUT_MS: "${CODEX_TIMEOUT_MS:-1800000}"
      CODEX_SYSTEM_PROMPT: "${CODEX_SYSTEM_PROMPT:-You are Codex. Reply concisely and helpfully.}"
    volumes:
      - "${ORCHESTORAI_DATA_DIR:-./data/docker-orchestorai-stack}:${ORCHESTORAI_RUNTIME_HOME:-/orchestorai}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
