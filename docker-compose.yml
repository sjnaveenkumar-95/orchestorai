services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orchestorai
      POSTGRES_PASSWORD: orchestorai
      POSTGRES_DB: orchestorai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestorai -d orchestorai"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://orchestorai:orchestorai@db:5432/orchestorai
      PORT: "3100"
      SERVE_UI: "true"
      ORCHESTORAI_DEPLOYMENT_MODE: "authenticated"
      ORCHESTORAI_DEPLOYMENT_EXPOSURE: "private"
      ORCHESTORAI_PUBLIC_URL: "${ORCHESTORAI_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - orchestorai-data:/orchestorai
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  orchestorai-data:
