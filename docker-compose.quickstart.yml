services:
  orchestorai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ORCHESTORAI_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      ORCHESTORAI_HOME: "/orchestorai"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ORCHESTORAI_DEPLOYMENT_MODE: "authenticated"
      ORCHESTORAI_DEPLOYMENT_EXPOSURE: "private"
      ORCHESTORAI_PUBLIC_URL: "${ORCHESTORAI_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${ORCHESTORAI_DATA_DIR:-./data/docker-orchestorai}:/orchestorai"
